# Railway 리포의 감정 에셋을 이 리포로 복사한다.
#
# 바이너리 파일을 GitHub API로 올리면 파일당 base64 46KB 수준의 오버헤드가 생기므로,
# 에셋 이식은 항상 이 워크플로를 통해 GitHub 내부에서 수행한다.
# 실행 방법: Actions 탭 → 이 워크플로 선택 → Run workflow
name: Import emotion assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Checkout asset source repo
        uses: actions/checkout@v4
        with:
          repository: amamirugi/claude-chan-emoticon-railway
          path: .asset-source

      - name: Copy assets
        run: |
          cp .asset-source/assets/*.webp assets/
          rm -rf .asset-source
          echo "--- assets/ 현황: $(ls -1 assets/*.webp | wc -l)개 ---"
          ls -1 assets/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "변경 없음. 종료."
          else
            git commit -m "chore: Railway 리포에서 감정 에셋 동기화"
            git push
          fi
